name: Daily Report Generation

on:
  schedule:
    - cron: '0 10 * * *'  # 10h UTC = 7h BRT (antes das 8h)
  workflow_dispatch:        # Trigger manual via GitHub Actions UI

jobs:
  generate-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Generate reports
        run: npm run generate-reports
        env:
          CURSEDUCA_API_KEY: ${{ secrets.CURSEDUCA_API_KEY }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          # gid da aba "Referência" (não é segredo — vem da URL da planilha)
          GOOGLE_SHEET_GID: '1568469200'
          PROSPERUS_WEBHOOK_URL: ${{ secrets.PROSPERUS_WEBHOOK_URL }}
          PROSPERUS_WEBHOOK_SECRET: ${{ secrets.PROSPERUS_WEBHOOK_SECRET }}

      - name: Upload report artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: output/reports/
          retention-days: 30
